<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Planner</title>
  <style>
    /* ========== Layout shell ==========
       Fixed height + flex column. #list takes the remaining space and
       scrolls internally; overflow:hidden on body stops the whole popup
       from scrolling behind it. Chrome caps popups at 800x600.          */

    body {
      width: 480px;
      height: 600px;
      box-sizing: border-box;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #101828;
      color: #f2f4f7;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      margin-right: auto;      /* pushes buttons right without claiming width */
      font-size: 13px;
      font-weight: 600;
      color: #98a2b3;
    }

    #list {
      flex: 1;
      min-height: 0;           /* flex children won't shrink below content without this */
      overflow-y: auto;
    }


    /* ========== Header buttons ========== */

    .tool-btn {
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #f2f4f7;
      background: #1d2939;
      border: 1px solid #344054;
      border-radius: 6px;
      cursor: pointer;
    }

    .tool-btn:hover:not(:disabled) { background: #344054; }
    .tool-btn:disabled { opacity: 0.35; cursor: default; }

    .tool-btn.add {
      padding: 3px 9px;
      font-size: 15px;
      line-height: 1;
      color: #7cd4fd;
      border-color: #164e63;
    }


    /* ========== Timer bar ==========
       Two states swapped by the .running class on #timerBar: idle shows
       the duration picker, running shows the countdown and Stop.        */

    #timerBar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-bottom: 10px;
      padding: 8px 10px;
      background: #1d2939;
      border-radius: 6px;
      border-left: 3px solid #344054;
    }

    #timerBar.running { border-left-color: #32d583; }

    #timerBar .label { font-size: 11px; font-weight: 600; color: #98a2b3; }

    #minutes {
      width: 56px;
      padding: 5px 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #f2f4f7;
      background: #101828;
      border: 1px solid #344054;
      border-radius: 6px;
    }

    #minutes:focus { outline: none; border-color: #7cd4fd; }

    #countdown {
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;   /* digits stop jittering as they change */
      color: #32d583;
      letter-spacing: 0.02em;
    }

    #blockNote {
      margin-left: auto;
      font-size: 10px;
      color: #667085;
    }

    #startBtn { color: #32d583; border-color: #1a5c3a; }
    #startBtn:hover:not(:disabled) { background: #0d3a26; }

    #stopBtn { margin-left: 8px; color: #fda29b; border-color: #7a271a; }
    #stopBtn:hover { background: #55160c; }

    /* Idle hides the running half, and vice versa. One class, no
       element-by-element toggling in JS. */
    #timerBar:not(.running) .when-running { display: none; }
    #timerBar.running .when-idle { display: none; }


    /* ========== Bloom's Taxonomy palette ==========
       Each card sets --accent (saturated, for the stripe) and
       --accent-soft (lighter, for text on the navy background) as
       inline custom properties. Everything below just reads them,
       so adding a level never means touching these rules.            */

    .card {
      margin-bottom: 8px;
      padding: 10px 12px;
      background: #1d2939;
      border-radius: 8px;
      border-left: var(--stripe, 3px) solid var(--accent, #7cd4fd);
      cursor: pointer;
    }

    .card.editing { cursor: default; }

    /* Amber "in progress" ring layered over the level colour, so you
       can still see which level you're on while typing. */
    .card.editing { box-shadow: inset 0 0 0 1px #fdb022; }

    .row { display: flex; align-items: flex-start; gap: 8px; }
    .row .q { flex: 1; }

    .q {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      white-space: pre-wrap;     /* keep Shift+Enter line breaks */
      overflow-wrap: anywhere;   /* long URLs don't blow out the card */
    }

    .hint {
      margin-top: 6px;
      font-size: 11px;
      font-style: italic;
      color: #667085;
    }

    .empty {
      padding: 20px 8px;
      font-size: 13px;
      line-height: 1.5;
      color: #667085;
      text-align: center;
    }


    /* ========== Dropdowns ==========
       One shared shell for the Bloom picker and the priority picker.
       appearance:none kills the OS widget so the control can match the
       card; the wrapper's ::after draws our own chevron.               */

    .picker {
      position: relative;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
    }

    .picker select {
      appearance: none;
      -webkit-appearance: none;
      padding: 2px 20px 2px 8px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      color: #98a2b3;
      background: #101828;
      border: 1px solid #344054;
      border-radius: 10px;
      cursor: pointer;
    }

    .picker select:focus-visible { outline: 1px solid #f2f4f7; outline-offset: 1px; }

    /* Option lists are painted by the OS, so give them explicit colours
       instead of inheriting the transparent-looking ones above. */
    .picker option { color: #f2f4f7; background: #1d2939; }

    .picker::after {
      content: "";
      position: absolute;
      right: 8px;
      width: 0;
      height: 0;
      pointer-events: none;          /* the arrow must not eat clicks */
      border-left: 3px solid transparent;
      border-right: 3px solid transparent;
      border-top: 4px solid #98a2b3;
    }

    /* Only the Bloom picker takes the level colour. The priority picker
       stays neutral grey on purpose — one palette per card. */
    .picker.level select { color: var(--accent-soft, #98a2b3); border-color: var(--accent-soft, #344054); }
    .picker.level::after { border-top-color: var(--accent-soft, #98a2b3); }


    /* ========== Priority group headers ==========
       The sort already puts Lethal on top; these just name the bands so
       the order is readable instead of merely true.                    */

    .group {
      margin: 2px 0 6px 3px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #667085;
    }

    .group + .card { margin-top: 0; }
    .group.lethal { color: #98a2b3; }
    .group:not(:first-child) { margin-top: 12px; }


    /* ========== Time meta row ==========
       Two read-outs and the Split button. Times are recomputed from
       stored timestamps on every render and on a 60s tick, so nothing
       here is a counter that could drift.                              */

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      font-size: 11px;
      color: #667085;
    }

    .meta .elapsed { color: #98a2b3; }
    .meta .elapsed.never { font-style: italic; color: #667085; }
    .meta .study-btn { margin-left: auto; }   /* pushed right, no fixed widths */

    .study-btn {
      flex-shrink: 0;
      padding: 3px 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      color: #32d583;
      background: #101828;
      border: 1px solid #1a5c3a;
      border-radius: 6px;
      cursor: pointer;
    }

    .study-btn:hover { background: #0d3a26; border-color: #32d583; }
    .study-btn:active { transform: translateY(1px); }


    /* ========== Card controls ========== */

    .del-btn {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      padding: 0;
      font-size: 16px;
      line-height: 1;
      color: #667085;
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .del-btn:hover { color: #fda29b; background: #101828; }


    /* ========== Edit mode ========== */

    .edit-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 8px;
    }

    .q-input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      min-height: 44px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #f2f4f7;
      background: #101828;
      border: 1px solid #344054;
      border-radius: 6px;
      resize: vertical;
    }

    .q-input:focus { outline: none; border-color: #fdb022; }

    .save-btn {
      margin-top: 8px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #101828;
      background: #7cd4fd;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .save-btn:hover { background: #36bffa; }
  </style>
</head>
<body>
  <header>
    <h1 id="heading">Study planner</h1>
    <button id="addBtn" class="tool-btn add" type="button"
            title="Add entry" aria-label="Add entry">+</button>
  </header>

  <div id="timerBar">
    <span class="label when-idle">Focus for</span>
    <input id="minutes" class="when-idle" type="number" min="1" max="180" step="1"
           value="25" aria-label="Timer duration in minutes">
    <span class="label when-idle">min</span>
    <button id="startBtn" class="tool-btn when-idle" type="button">Start</button>
    <span class="when-idle" id="blockNote">blocks 14 sites while running</span>

    <span id="countdown" class="when-running">00:00</span>
    <span class="label when-running" id="runNote">distractions blocked</span>
    <button id="stopBtn" class="tool-btn when-running" type="button">Stop</button>
  </div>

  <div id="list"></div>

  <!-- MV3 forbids inline scripts, so the logic lives in its own file -->
  <script src="popup.js"></script>
</body>
</html>
