<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blocked — Study Planner</title>
  <style>
    :root { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: system-ui, sans-serif;
      text-align: center;
      background: #101828;
      color: #f2f4f7;
    }

    #clock {
      font-size: 72px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;   /* digits stop jittering */
      color: #32d583;
      letter-spacing: 0.02em;
    }

    h1 { margin: 0; font-size: 18px; font-weight: 600; }

    #host { margin: 0; font-size: 13px; color: #667085; }

    #note {
      margin-top: 18px;
      max-width: 420px;
      font-size: 13px;
      line-height: 1.6;
      color: #98a2b3;
    }

    #continueBtn {
      margin-top: 22px;
      padding: 9px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #101828;
      background: #7cd4fd;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #continueBtn:hover { background: #36bffa; }
    #continueBtn[hidden] { display: none; }

    .done #clock { color: #7cd4fd; }
  </style>
</head>
<body>
  <div id="clock">--:--</div>
  <h1 id="headline">Focus timer running</h1>
  <p id="host"></p>
  <p id="note">This site is on your blocklist until the timer ends. You can stop the timer from the Study Planner popup if you really need to.</p>
  <button id="continueBtn" type="button" hidden></button>
  <script src="blocked.js"></script>
</body>
</html>
